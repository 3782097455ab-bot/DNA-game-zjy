<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d24">
  <meta name="description" content="沿着复制叉解开 DNA，为新链逐个选入互补碱基。">
  <title>碱基筑造师 · DNA 半保留复制</title>
  <link rel="stylesheet" href="styles.css">
  <script src="replication.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body data-page="home">
  <header class="site-header">
    <button class="brand" type="button" data-action="home" aria-label="碱基筑造师首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>碱基筑造师</span>
    </button>
    <nav aria-label="主导航">
      <button type="button" data-dialog="mechanism">复制机制</button>
      <button type="button" data-dialog="rules">玩法说明</button>
      <button type="button" data-dialog="genes">基因图鉴</button>
    </nav>
  </header>

  <main>
    <section id="home" class="hero" aria-labelledby="title">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="hero-topic"><span></span>DNA 半保留复制</p>
        <h1 id="title" tabindex="-1"><span>碱基</span><span>筑造师</span></h1>
        <p class="hero-copy">双螺旋解开后，两条亲代链各自成为模板。<br class="desktop-break">沿着复制叉，为新链选入正确的碱基。</p>
        <div class="hero-actions">
          <button type="button" class="primary" data-action="play">开始复制 <span aria-hidden="true">↗</span></button>
          <button type="button" class="quiet watch" data-action="demo"><i aria-hidden="true">▷</i>观看演示</button>
        </div>
      </div>
      <div class="hero-footer">
        <span class="hero-footer-name">有机建造 · 互动科普</span>
        <span class="hero-footer-line"></span>
        <span class="hero-footer-steps">解旋 <i></i> 互补配对 <i></i> 新链延伸</span>
      </div>
    </section>

    <section id="lab" class="lab" hidden aria-labelledby="lab-title">
      <header class="lab-head">
        <div>
          <p id="lab-kicker" class="section-label">DNA 半保留复制</p>
          <h2 id="lab-title" tabindex="-1">复制叉</h2>
        </div>
        <div class="readouts" aria-label="复制进度">
          <div id="segment-readout"><span>练习片段</span><strong id="segment">1 / 3</strong></div>
          <div id="clock-readout"><span>剩余时间</span><strong id="clock">1:15</strong></div>
          <div id="score-readout"><span>总分</span><strong id="score">0</strong></div>
          <button id="pause" type="button" class="quiet pause" aria-pressed="false">暂停</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="inspector" aria-label="当前复制位点">
          <p id="site-caption" class="section-label">当前模板碱基</p>
          <div class="observed-base">
            <strong id="observed-letter">A</strong>
            <span id="observed-name">腺嘌呤</span>
          </div>
          <p id="site-context" class="site-context">解旋酶正在打开亲代双链。</p>
          <button id="zoom" type="button" class="quiet zoom" aria-pressed="false"><span aria-hidden="true">⌖</span> 放大位点</button>
          <div class="stage-legend" aria-label="复制叉图例">
            <span><i class="old"></i>亲代链</span>
            <span><i class="new"></i>新链</span>
            <span><i class="primer"></i>RNA 引物</span>
          </div>
        </aside>

        <figure class="fork">
          <div class="scene">
            <canvas id="fork-canvas" width="1140" height="486" role="img" aria-describedby="direction-guide">
              复制叉示意。前导链向右连续延伸，后随链向左逐段延伸，两条新链均沿 5′ 到 3′ 方向合成。
            </canvas>
            <p id="scene-note" class="scene-note" hidden>演示已暂停</p>
          </div>
          <figcaption id="direction-guide" class="direction-guide">
            <span><b>前导链</b> <span>5′ → 3′</span> 连续延伸</span>
            <span><b>后随链</b> <span>3′ ← 5′</span> 逐段延伸</span>
          </figcaption>
        </figure>
      </div>

      <div class="interaction">
        <div>
          <h3 id="interaction-title">选择互补碱基</h3>
          <p id="feedback" aria-live="polite">等待解旋酶打开双链</p>
        </div>
        <div id="base-controls" class="base-controls" aria-label="选择互补碱基">
          <button type="button" class="base-key purine" data-base="A" aria-label="A，腺嘌呤"><span class="base-shape"></span><b>A</b><span>腺嘌呤</span></button>
          <button type="button" class="base-key" data-base="T" aria-label="T，胸腺嘧啶"><span class="base-shape"></span><b>T</b><span>胸腺嘧啶</span></button>
          <button type="button" class="base-key" data-base="C" aria-label="C，胞嘧啶"><span class="base-shape"></span><b>C</b><span>胞嘧啶</span></button>
          <button type="button" class="base-key purine" data-base="G" aria-label="G，鸟嘌呤"><span class="base-shape"></span><b>G</b><span>鸟嘌呤</span></button>
        </div>
        <button id="demo-play" class="primary" type="button" data-action="play" hidden>开始练习 <span aria-hidden="true">↗</span></button>
      </div>
    </section>

    <section id="results" class="results" hidden aria-labelledby="result-title">
      <div class="result-art"><img src="assets/replication.webp" alt="两个子代 DNA 各由一条青色亲代链和一条金色新链组成"></div>
      <div class="result-content">
        <p id="result-kicker" class="section-label">练习结算</p>
        <h2 id="result-title" tabindex="-1">复制完成</h2>
        <p id="result-copy"></p>
        <dl id="result-stats" class="result-stats"></dl>
        <ul id="result-breakdown" class="result-breakdown"></ul>
        <div class="result-actions">
          <button id="replay" class="primary" type="button" data-action="play">再玩一局 <span aria-hidden="true">↗</span></button>
          <button id="result-genes" type="button" class="quiet" data-dialog="genes">查看图鉴 <span aria-hidden="true">↗</span></button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title">
    <div class="dialog-head">
      <h2 id="info-title"></h2>
      <button id="info-close" class="quiet close" type="button" aria-label="关闭">×</button>
    </div>
    <div id="info-content"></div>
  </dialog>

  <dialog id="segment-dialog" class="info-dialog checkpoint" aria-labelledby="segment-title">
    <p class="section-label">图鉴已解锁</p>
    <h2 id="segment-title"></h2>
    <p id="segment-description"></p>
    <p id="segment-total" class="section-label"></p>
    <button id="continue" class="primary" type="button">继续复制 <span aria-hidden="true">↗</span></button>
  </dialog>
</body>
</html>
